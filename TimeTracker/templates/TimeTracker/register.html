{% extends 'TimeTracker/base.html' %}
{% block content %}
<a href="{% url 'login' %}" style="color: var(--primary); font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 20px;">
    &larr; Back to log in
</a>

<div style="text-align: center; margin: 0 0 24px 0;">
    <div style="font-size: 36px; margin-bottom: 6px;"></div>
    <div style="font-size: 24px; font-family: Georgia, serif; font-weight: 700; color: #b5e4c2;">TimeTracker</div>
</div>

<div style="background: #141b14; border: 1px solid var(--surface-border); border-radius: 14px; padding: 4px; display: flex; margin-bottom: 24px;">
    <a href="{% url 'login' %}" style="flex: 1; text-align: center; padding: 10px; color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600;">Log in</a>
    <div style="flex: 1; text-align: center; padding: 10px; background: var(--primary); color: #09130b; border-radius: 10px; font-weight: 700; font-size: 14px;">Register</div>
</div>

{% if error %}
<div style="background: #381f1f; color: #ff8b8b; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px;">{{ error }}</div>
{% endif %}

<form method="POST">
    {% csrf_token %}
    <div class="form-group">
        <label class="form-label">Sign up as</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <label id="card-employee" class="role-btn-card active" style="border-radius: 12px; padding: 14px 12px; cursor: pointer; text-align: center; display: block; transition: all 0.2s ease;">
                <input type="radio" name="role" value="EMPLOYEE" checked style="display: none;" onchange="handleRoleChange('EMPLOYEE')">
                <div style="font-weight: 700; font-size: 14px;">Employee</div>
                <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">Teacher / staff clocking in</div>
            </label>
            <label id="card-admin" class="role-btn-card" style="border-radius: 12px; padding: 14px 12px; cursor: pointer; text-align: center; display: block; transition: all 0.2s ease;">
                <input type="radio" name="role" value="ADMIN" style="display: none;" onchange="handleRoleChange('ADMIN')">
                <div style="font-weight: 700; font-size: 14px;">Admin</div>
                <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">Manages attendance & approvals</div>
            </label>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Full name</label>
        <input type="text" name="full_name" class="input-box" placeholder="Juan Dela Cruz" required>
    </div>

    <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="input-box" placeholder="you@timetracker.edu" required>
    </div>

    <div class="form-group">
        <label class="form-label">Department / Subject</label>
        <input type="text" name="department" class="input-box" placeholder="e.g. Filipino, HR, Accounting" required>
    </div>

    <!-- Workplace Google Maps URL field (available for both Employee and Admin) -->
    <div class="form-group" id="workplaceGroup">
        <label class="form-label">Workplace Google Maps URL</label>
        <input type="url" name="workplace_url" class="input-box" placeholder="https://maps.google.com/place/...">
    </div>

    <!-- Admin only invite code -->
    <div class="form-group" id="inviteCodeGroup" style="display: none;">
        <label class="form-label">Admin invite code</label>
        <input type="text" name="invite_code" class="input-box" placeholder="Provided by your organization">
    </div>

    <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="input-box" placeholder="Minimum 8 characters" required>
    </div>

    <button type="submit" class="btn-primary">Create account</button>
</form>

<style>
    .role-btn-card {
        border: 1px solid var(--surface-border);
        background: var(--surface);
    }
    .role-btn-card.active {
        border: 1px solid var(--primary) !important;
        background: #132216 !important;
    }
</style>

<script>
    function handleRoleChange(role) {
        const employeeCard = document.getElementById('card-employee');
        const adminCard = document.getElementById('card-admin');
        const inviteGroup = document.getElementById('inviteCodeGroup');

        if (role === 'EMPLOYEE') {
            employeeCard.classList.add('active');
            adminCard.classList.remove('active');
            inviteGroup.style.display = 'none';
        } else {
            adminCard.classList.add('active');
            employeeCard.classList.remove('active');
            inviteGroup.style.display = 'block';
        }
    }
</script>
{% endblock %}
