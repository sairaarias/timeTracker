<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TimeTracker Admin</title>
 <style>
    :root {
        --bg: #0e140f;
        --surface: #171f18;
        --surface-border: #232d24;
        --primary: #75b888;
        --primary-hover: #86c999;
        --text-main: #f0f4f1;
        --text-muted: #889689;
        --accent-orange: #d97736;
    }

    *, *::before, *::after { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }

    /* Seamless full-screen background */
    body { 
        background: var(--bg); 
        color: var(--text-main); 
        min-height: 100vh; 
        width: 100%;
        overflow-x: hidden;
    }

    /* Main container: Centered and responsive column */
    .app-shell { 
        width: 100%; 
        max-width: 900px; /* Comfortable width for desktop tables & cards */
        margin: 0 auto;   /* Centers the entire layout on screen */
        min-height: 100vh; 
        padding: 24px 20px 110px 20px; 
        position: relative; 
        display: flex;
        flex-direction: column;
        align-items: stretch; /* Ensures all children align consistently */
    }

    @media (min-width: 768px) {
        .app-shell {
            padding: 36px 28px 120px 28px;
        }
    }

    /* Navigation header */
    .top-nav { 
        display: flex; 
        align-items: center; 
        justify-content: space-between; 
        margin-bottom: 24px; 
        width: 100%;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 19px; color: #b5e4c2; }
    .avatar-badge { background: #1f2b21; color: var(--primary); padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 13px; }
    .btn-logout { background: transparent; border: 1px solid var(--surface-border); color: var(--text-muted); padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; text-decoration: none; transition: background 0.2s; }
    .btn-logout:hover { background: rgba(255, 255, 255, 0.05); }

    /* Section titles & headers */
    .page-tag { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--primary); text-transform: uppercase; margin-bottom: 4px; }
    .page-title { font-size: 26px; font-family: Georgia, serif; font-weight: 600; margin-bottom: 6px; }
    .page-sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; line-height: 1.4; }

    /* Fix section label alignment (e.g. "Needs your attention", "Today's snapshot", "All staff") */
    h2, h3, h4, .section-title {
        width: 100%;
        text-align: left;
        margin-top: 18px;
        margin-bottom: 12px;
        font-size: 15px;
        font-weight: 600;
        color: var(--text-main);
    }

    /* Cards & Containers */
    .card { 
        background: var(--surface); 
        border: 1px solid var(--surface-border); 
        border-radius: 18px; 
        padding: 18px; 
        margin-bottom: 14px; 
        width: 100%;
    }

    /* Stat Cards Row (0 Clocked in now / 0 Completed today / 1 Not clocked in yet) */
    .stat-grid,
    div[style*="display: grid; grid-template-columns: 1fr 1fr 1fr"] {
        display: grid !important;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) !important;
        gap: 12px !important;
        width: 100% !important;
        margin-bottom: 20px !important;
    }

    /* Buttons */
    .btn-primary { width: 100%; background: var(--primary); color: #0b170e; border: none; border-radius: 12px; padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer; text-align: center; text-decoration: none; display: inline-block; transition: background 0.2s; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { width: 100%; background: #161e17; border: 1px solid var(--surface-border); color: var(--text-main); border-radius: 12px; padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }

    /* Responsive Floating Bottom Navigation Bar */
    .bottom-nav { 
        position: fixed; 
        bottom: 0; 
        left: 0; 
        width: 100%; 
        background: #0c120d; 
        border-top: 1px solid var(--surface-border); 
        display: flex; 
        justify-content: space-around; 
        align-items: center; 
        padding: 14px 12px; 
        min-height: 64px; 
        z-index: 100; 
    }

    .nav-item { 
        color: var(--text-muted); 
        text-decoration: none; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        font-size: 12px; 
        font-weight: 500; 
        gap: 4px; 
        padding: 6px 14px; 
        border-radius: 8px; 
        transition: color 0.2s ease, background-color 0.2s ease; 
    }
    .nav-item:hover { color: var(--text-main); }
    .nav-item.active { color: var(--primary); font-weight: 700; }

    @media (min-width: 768px) {
        .bottom-nav { 
            left: 50%; 
            transform: translateX(-50%); 
            max-width: 720px; 
            bottom: 16px; 
            border: 1px solid var(--surface-border); 
            border-radius: 18px; 
            padding: 12px 24px; 
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55); 
        }
        .nav-item { font-size: 13px; }
    }

    /* Inputs & Selects */
    input, select, textarea { 
        width: 100%; 
        background: #121813; 
        border: 1px solid var(--surface-border); 
        border-radius: 12px; 
        padding: 12px 14px; 
        color: var(--text-main); 
        font-size: 14px; 
        outline: none; 
        box-sizing: border-box; 
    }
    input:focus, select:focus, textarea:focus { 
        border-color: var(--primary); 
        box-shadow: 0 0 0 1px var(--primary); 
    }

    /* Responsive Data Tables */
    .table-responsive {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        margin-bottom: 16px;
        border-radius: 12px;
        border: 1px solid var(--surface-border);
    }
</style>
</head>
<body>
    <div class="app-shell">
        <div class="top-nav">
            <div class="brand">⏱ TimeTracker</div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <span class="avatar-badge">{{ user.first_name|default:user.username|slice:":2"|upper }}</span>
                <a href="{% url 'logout' %}" class="btn-logout">Log out</a>
            </div>
        </div>

        {% block content %}{% endblock %}

        <nav class="bottom-nav">
            <a href="{% url 'admin_overview' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_overview' %}active{% endif %}">Overview</a>
            <a href="{% url 'admin_logs' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_logs' %}active{% endif %}">Log</a>
            <a href="{% url 'admin_leave' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_leave' %}active{% endif %}">Leave</a>
            <a href="{% url 'admin_users' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_users' %}active{% endif %}">Users</a>
            <a href="{% url 'admin_reports' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_reports' %}active{% endif %}">Reports</a>
        </nav>
    </div>
</body>
</html>
